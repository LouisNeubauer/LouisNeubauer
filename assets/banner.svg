<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Louis Neubauer — MIT Sloan MSMS 2027. I build software that stays live.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0E1A2F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <g transform="translate(80, 96)">
    <text x="0" y="0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="17" font-weight="600" letter-spacing="4.5" fill="#7DD3FC">MIT SLOAN · MSMS 2027</text>
    <text x="0" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="66" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">Louis Neubauer</text>
    <text x="0" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="25" font-weight="400" fill="#94A3B8">I build software that stays live after the demo.</text>
    <rect x="0" y="152" width="96" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
          font-size="16" fill="#64748B">machine learning · applied AI · full-stack · energy &amp; capital markets</text>
  </g>

  <g transform="translate(1012, 104)" opacity="0.95">
    <rect x="0"   y="0"  width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="66"  y="0"  width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="132" y="0"  width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="0"   y="66" width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="66"  y="66" width="52" height="52" rx="10" fill="url(#accent)"/>
    <rect x="132" y="66" width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="0"   y="132" width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="66"  y="132" width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <rect x="132" y="132" width="52" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
  </g>
</svg>
